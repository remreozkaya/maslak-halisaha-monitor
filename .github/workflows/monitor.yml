name: Maslak reservation monitor
on:
  schedule:
    # UTC = Europe/Istanbul minus 3 hours.
    - cron: '*/5 7-23 * * 5'
    - cron: '*/5 * * * 6,0'
    - cron: '*/5 0-6 * * 1'
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        default: dry-run
        options:
          - dry-run
          - monitor
          - test-email
          - probe-week
      week:
        description: Diagnostic Monday (YYYY-MM-DD), only for probe-week
        type: string
        default: '2026-10-19'
      checks:
        description: Checks per monitor session (1-61; normally 61)
        type: string
        default: '61'
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.mode == 'monitor') && 'maslak-monitor' || format('maslak-diagnostic-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    env:
      ITU_USERNAME: ${{ secrets.ITU_USERNAME }}
      ITU_PASSWORD: ${{ secrets.ITU_PASSWORD }}
      NOTIFICATION_CHANNEL: email
      AVAILABILITY_MODE: calendar
      EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '465'
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PURCHASE_SELECTOR_VERIFIED: ${{ vars.PURCHASE_SELECTOR_VERIFIED || 'false' }}
      PURCHASE_BUTTON_TEXT: ${{ vars.PURCHASE_BUTTON_TEXT || 'Satın Al' }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install monitor
        run: python -m pip install --disable-pip-version-check .
      - name: Verify encrypted notification history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'monitor' }}
        run: |
          python - <<'PYCODE'
          import os
          from maslak_monitor.github_state import GithubState, RemoteStore
          remote=GithubState(os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_TOKEN'],os.environ['STATE_ENCRYPTION_KEY'].encode())
          try:
              with RemoteStore(remote) as store:
                  store.db.execute('SELECT COUNT(*) FROM recipients').fetchone()
              print('encrypted_history=verified')
          finally:
              remote.close()
          PYCODE
      - name: Check reservation availability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: python -m maslak_monitor.github_runner
      - name: Poll every five minutes and hand off to next session
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'monitor' }}
        env:
          SESSION_CHECKS: ${{ inputs.checks || '61' }}
        run: python -u -m maslak_monitor.github_loop --checks "$SESSION_CHECKS"
      - name: Send labelled connection test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test-email' }}
        run: python -m maslak_monitor --test-email
      - name: Read-only diagnostic week
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'probe-week' }}
        env:
          PROBE_WEEK: ${{ inputs.week }}
        run: python -m maslak_monitor --probe-week "$PROBE_WEEK"
