[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maslak-monitor"
version = "0.3.0"
description = "Maslak Hali Saha availability monitor"
requires-python = ">=3.12"
dependencies = ["playwright==1.63.0", "httpx==0.28.1", "cryptography==46.0.7"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
maslak-monitor = "maslak_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
